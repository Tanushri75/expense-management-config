server.port = 8080

#expense-route-1
spring.cloud.gateway.server.webflux.routes[0].id=expense-ms-public
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/expenses/**

#expense-route-2
spring.cloud.gateway.server.webflux.routes[1].id=expense-ms-internal
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/internal/expenses/**

spring.cloud.gateway.server.webflux.routes[2].id=approval-ms
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/approvals/**

spring.cloud.gateway.server.webflux.routes[3].id=payment-ms
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/payments/**
